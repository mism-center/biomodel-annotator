model:
  name:
    value: "Kermack-McKendrick SIR Epidemic Model"
    source: "Kermack & McKendrick (1927), paper title: 'A Contribution to the Mathematical Theory of Epidemics'"
    confidence: high
  short_description:
    value: "A deterministic ODE compartmental model partitioning a closed, well-mixed population into Susceptible (S), Infective (I), and Removed (R) classes; derives the epidemic threshold theorem showing that an outbreak requires the initial susceptible density to exceed the ratio of removal rate to transmission rate."
    source: "Kermack & McKendrick (1927), Abstract and pp. 700-701"
    confidence: high
  long_description:
    value: "Kermack & McKendrick (1927) introduced the SIR compartmental framework for modelling the spread of an infectious disease through a closed, homogeneously mixed population of fixed size N = S + I + R. The dynamics are governed by three coupled ODEs: dS/dt = -\u03baS\u03b9, dI/dt = \u03baSI - lI, dR/dt = lI, where \u03ba (kappa) is the contact-transmission rate and l the removal rate. The paper proves the epidemic threshold: a significant outbreak occurs only when S0 > \u03c1 = l/\u03ba (equivalently, the basic reproduction number R0 = \u03baS0/l > 1). Closed-form approximations for the final epidemic size z are also derived. The model is deliberately generic \u2014 no specific pathogen, host organism, or time-scale is fixed; the equations apply to any directly transmitted infectious disease satisfying the well-mixed, closed-population assumptions. The 1927 paper is the first in a series; later papers by the same authors extend the framework to variable susceptibility and immunity."
    source: "Kermack & McKendrick (1927), Sections I-IV, equations (1)-(34), pp. 700-721"
    confidence: high
