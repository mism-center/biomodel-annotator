        confidence: high
        iri: null
        ontology_label: null
        ontology: GO
      - value: "methylation-based sensory adaptation"
        source: "chemoreceptor_cluster.py:54-60"
        confidence: high
        notes: >-
          CheR methyltransferase and CheB methylesterase modelled explicitly;
          default parameters CheR=0.00016, CheB=0.00028 at
          chemoreceptor_cluster.py:103-104
        iri: null
