  short_description:
    value: "A multi-scale agent-based library for modeling E. coli chemotaxis, integrating chemoreceptor cluster signaling, flagella motor dynamics, and membrane potential within the Vivarium framework."
    source: "README.md:3-5"
    confidence: high
  long_description:
    value: "A Python library implementing the multi-scale model of E. coli chemotaxis described in Agmon & Spangler (2020). Structured as composable Vivarium processes covering chemoreceptor cluster activity (MWC model of Tsr/Tar receptors), flagella motor switching, and membrane potential. The full master composite additionally integrates metabolism (FBA via iAF1260b), transcription, translation, complexation, and degradation. Individual processes and composites can run standalone or be assembled into multi-agent spatial experiments."
    source: "README.md:3-18; chemotaxis_master.py:74-97"
    confidence: high
  version:
    value: "0.0.2"
    source: "setup.py:13"
    confidence: high
  identifier:
    scheme: "url"
    value: "https://github.com/vivarium-collective/vivarium-chemotaxis"
    source: "setup.py:21"
  model_class:
