model:
  name:
    value: "vivarium-chemotaxis"
    source: "README.md:1"
    confidence: high

  short_description:
    value: >-
      A Python library modelling Escherichia coli chemotaxis across molecular and cellular
      scales using the vivarium compositional simulation framework. Implements four composable
      processes (ReceptorCluster, FlagellaMotor, MembranePotential, CoarseMotor) that together
      reproduce the MeAsp attractant stimulus-response described in Agmon & Spangler (2020).
    source: "README.md:2-4, setup.py:16-17"
    confidence: high

  version:
    value: "0.0.2"
    source: "setup.py:13"
    confidence: high

  identifier:
    scheme: github
    id: "vivarium-collective/vivarium-chemotaxis"
    source: "setup.py:21"
    confidence: high

  license:
    value: MIT
    source: "LICENSE:1, setup.py:22"
    confidence: high

  model_class:
    - value: "multi-scale model"
      source: "README.md:3"
      confidence: high
      notes: >-
        README title names this "A Multi-Scale Approach"; composites span molecular
        (receptor, CheY-P) and cellular (motor ensemble, metabolic) scales explicitly.
      iri: null
      ontology_label: null
      ontology: MAMO

  formalism:
    - value: "ordinary differential equation model"
      source: "chemoreceptor_cluster.py:54-60"
      confidence: high
      notes: >-
        MWC allosteric ODE model of receptor cluster activity and CheR/CheB methylation
        kinetics. MembranePotential process uses GHK equations (membrane_potential.py:1-100).
      iri: null
      ontology_label: null
      ontology: MAMO
    - value: "stochastic model"
      source: "flagella_motor.py:44-46"
      confidence: high
      notes: >-
        Per-flagellum CCW/CW rotational state transitions modelled stochastically (Sneddon
        2012 veto model). CoarseMotor also uses discrete stochastic state switching
        (coarse_motor.py:60-81).
      iri: null
      ontology_label: null
      ontology: MAMO

  determinism:
    value: hybrid
    source: "chemoreceptor_cluster.py:54-60, flagella_motor.py:44-46"
    confidence: inferred
    notes: >-
      ODE subsystems (ReceptorCluster, MembranePotential) are deterministic; motor
      subsystems (FlagellaMotor, CoarseMotor) are stochastic. Composition is hybrid.

  time_dynamics:
    value: continuous
    source: "coarse_motor.py:49"
    confidence: inferred
    notes: "Fixed time_step=0.1 at coarse_motor.py:49; vivarium-core integrates forward continuously"

  spatial:
    value: non-spatial
    source: "README.md"
    confidence: inferred
    notes: "No spatial coordinates, grids, or PDEs observed in any process file. Cells modelled as well-mixed compartments."

  multiscale:
    value: true
    source: "README.md:3"
    confidence: high

  model_scales:
    - value: molecular
      source: "chemoreceptor_cluster.py:26, flagella_motor.py:50-52"
      confidence: inferred
      notes: >-
        Molecular-scale state variables: receptor methylation level (n_methyl),
        phosphorylated CheY (CheY_P in M), proton-motive force (PMF in mV)
    - value: cellular
      source: "chemotaxis_master.py:23"
      confidence: inferred
      notes: >-
        Cellular-scale: flagellar motor ensemble bias, whole-cell metabolic model
        iAF1260b imported at chemotaxis_master.py:23

  biology:
    species:
      - value: "Escherichia coli K-12"
