      iri: null
      ontology_label: null
      ontology: "mamo"
      source: "chemotaxis_flagella.py:21 (MetaDivision import); paper_experiments.py:31 (agent_environment_experiment import)"
      confidence: high
    - value: "constraint-based model"
      iri: null
      ontology_label: null
      ontology: "mamo"
      source: "chemotaxis_master.py:22-23 (Metabolism + get_iAF1260b_config import — FBA via iAF1260b metabolic reconstruction)"
      confidence: high
  formalism:
    - value: "ordinary differential equation model"
      iri: null
      ontology_label: null
      ontology: "mamo"
      source: "chemoreceptor_cluster.py:30-44 (run_step and run_to_steady_state integrate continuous state variables n_methyl and chemoreceptor_activity via fixed-timestep Euler updates)"
      confidence: medium
    - value: "stochastic model"
      iri: null
      ontology_label: null
      ontology: "mamo"
      source: "flagella_motor.py:43-46 (FlagellaMotor docstring: stochastic model of motor switching based on Sneddon 2012)"
      confidence: high
