name: Package & Release Skill

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next semver
        id: bump
        run: |
          set -euo pipefail
          git fetch --tags --force
          latest="$(git tag -l 'v*' --sort=-v:refname | head -n1)"
          if [ -z "$latest" ]; then
            major=0; minor=0; patch=0
            echo "No prior tag. Starting from v0.0.0."
          else
            echo "Latest tag: $latest"
            ver="${latest#v}"
            IFS='.' read -r major minor patch <<< "$ver"
          fi

          msg="$(git log -1 --pretty=%B)"
          if echo "$msg" | grep -qiE '(^|[^[:alnum:]])#major([^[:alnum:]]|$)'; then
            major=$((major + 1)); minor=0; patch=0
            bump=major
          elif echo "$msg" | grep -qiE '(^|[^[:alnum:]])#minor([^[:alnum:]]|$)'; then
            minor=$((minor + 1)); patch=0
            bump=minor
          else
            patch=$((patch + 1))
            bump=patch
          fi

          new="v${major}.${minor}.${patch}"
          echo "Bump: $bump -> $new"
          echo "version=$new" >> "$GITHUB_OUTPUT"
          echo "version_bare=${new#v}" >> "$GITHUB_OUTPUT"
          echo "bump=$bump" >> "$GITHUB_OUTPUT"

      - name: Lint schema/ontologies field-name consistency
        run: |
          set -euo pipefail
          # Ensure the biology field name used in schema.md ('biology.species') matches
          # what ontologies.md references.  This catches renames that break the agent's
          # output consistency (the species/organisms drift seen in metadata-package-3).
          if grep -qE 'biology\.organisms' references/ontologies.md; then
            echo "ERROR: references/ontologies.md uses 'biology.organisms' but schema.md uses 'biology.species'. Update ontologies.md."
            exit 1
          fi
          if ! grep -qE 'biology\.species' references/ontologies.md; then
            echo "ERROR: references/ontologies.md does not reference 'biology.species'. Add it to the routing table."
            exit 1
          fi
          echo "Schema/ontologies consistency check passed."

      - name: Build skill zip (strict allowlist)
        id: pack
        run: |
          set -euo pipefail
          ver="${{ steps.bump.outputs.version }}"
          name="biomodel-annotator"
          staging="$(mktemp -d)/$name"
          mkdir -p "$staging"

          # Allowlist: SKILL.md + every file under references/ + scripts/validate.py.
          # Nothing else ships. No LICENSE, no CLAUDE.md, no .github, no .git,
          # no editor cruft, no future top-level files unless explicitly added here.
          test -f SKILL.md              || { echo "SKILL.md missing";              exit 1; }
          test -d references            || { echo "references/ missing";            exit 1; }
          test -f scripts/validate.py   || { echo "scripts/validate.py missing";    exit 1; }
          cp SKILL.md "$staging/SKILL.md"
          mkdir -p "$staging/references"
          # Only .md files in references/ (the two reference docs SKILL.md cites).
          shopt -s nullglob
          ref_files=(references/*.md)
          [ ${#ref_files[@]} -gt 0 ] || { echo "no reference .md files"; exit 1; }
          cp "${ref_files[@]}" "$staging/references/"
          # Bundled validator script (PEP 723 inline deps; run with uv).
          mkdir -p "$staging/scripts"
          cp scripts/validate.py "$staging/scripts/"

          # Verify staging contains ONLY allowlisted paths.
          unexpected="$(cd "$staging" && find . -mindepth 1 \
            ! -path './SKILL.md' \
            ! -path './references' \
            ! -path './references/*.md' \
            ! -path './scripts' \
            ! -path './scripts/validate.py' \
            -print)"
          if [ -n "$unexpected" ]; then
            echo "ERROR: unexpected files in staging:"
            echo "$unexpected"
            exit 1
          fi

          zip_path="$PWD/${name}-${ver}.zip"
          (cd "$(dirname "$staging")" && zip -r "$zip_path" "$name" >/dev/null)

          echo "Packaged contents:"
          unzip -l "$zip_path"

          # Final guard: anything outside the allowlist inside zip fails the build.
          bad="$(unzip -Z1 "$zip_path" | grep -Ev '^biomodel-annotator/(|SKILL\.md|references/(|[^/]+\.md)|scripts/(|validate\.py))$' || true)"
          if [ -n "$bad" ]; then
            echo "ERROR: zip contains non-skill entries:"
            echo "$bad"
            exit 1
          fi

          echo "zip_path=$zip_path" >> "$GITHUB_OUTPUT"
          echo "zip_name=$(basename "$zip_path")" >> "$GITHUB_OUTPUT"

      - name: Create & push tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ver="${{ steps.bump.outputs.version }}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$ver" -m "Release $ver"
          git push origin "$ver"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ver="${{ steps.bump.outputs.version }}"
          gh release create "$ver" \
            --title "$ver" \
            --notes "Automated release of biomodel-annotator skill.

          Bump type: ${{ steps.bump.outputs.bump }}
          Commit: ${{ github.sha }}" \
            "${{ steps.pack.outputs.zip_path }}"

      # Docker CD: build the Pi harness image (skill + extensions baked in) and
      # push it to Docker Hub tagged with the same semver as the release + latest.
      # Lives in this job (not a downstream workflow) because tags/releases pushed
      # by GITHUB_TOKEN do not trigger other workflows.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: mismplatform
          password: ${{ secrets.MISM_DOCKER_PUSH_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push release image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: harness/Dockerfile
          push: true
          tags: |
            mismplatform/pi-agent:${{ steps.bump.outputs.version_bare }}
            mismplatform/pi-agent:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
